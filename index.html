<style>

header{gap:6px}.logo{width:36px;height:36px}.sq{width:36px;height:36px;font-size:16px;border-radius:11px}.seg button{padding:6px 7px;font-size:12px}.ti b{font-size:15px}.ti button{font-size:11px;max-width:none;display:block;max-width:100%}

.sheet{overflow-x:hidden}.sheet>*{max-width:100%}.two>*{min-width:0}

.sheet .seg{width:100%;margin:4px 0 8px}.sheet .seg button{flex:1;padding:8px;font-size:13px}

.hrow{position:relative;justify-content:center}.hrow h2{text-align:center}.hrow .xb{position:absolute;right:0;top:50%;transform:translateY(-50%)}

.hrow.l{justify-content:flex-start}.hrow.l h2{text-align:left}
.xb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--pn);color:var(--tx);font-size:16px;flex:none;line-height:1}
.bal{cursor:pointer;transition:transform .12s}.bal:active{transform:scale(.98)}#rbal{cursor:default}#rbal:active{transform:none}

.rec.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s}
.rhd{padding:0 16px}.rsub{text-align:center;color:var(--mut);font-size:12px;letter-spacing:.7px;text-transform:uppercase;font-weight:600;margin:10px 0 0}
.rbd{flex:1;overflow-y:auto;padding:4px 16px 130px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.rx{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--pn2);color:var(--tx);font-size:22px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .12s}.rx:active{transform:scale(.92)}
</style></head><body>
<div class="app">

<div class="shade" id="sh"><div class="sheet" id="sheet"></div></div>
<script>
const CE0=[["Food","🍔","#ff7a1a"],["Transport","🚗","#3b82f6"],["Shopping","🛍️","#ff6eb4"],["Bills","⚡","#f5b800"],["Home","🏠","#8b5cf6"],["Health","❤️","#ff4565"],["Leisure","🎬","#22d3ee"],["Family","🎁","#fb7185"],["Education","🎓","#10b981"],["Other","📦","#94a3b8"]];
let CE=CE0;
function applyCats(){CE=CE0.map(c=>{const s=(S.cats||[]).find(x=>x.k===c[0]);return s?[c[0],s.emoji||c[1],c[2],s.name||c[0]]:[c[0],c[1],c[2],c[0]]}).concat((S.custom||[]).map(c=>[c.k,c.emoji,c.color,c.name]))}
const CI=[["Salary","💼","#19c37d"],["Business","🏪","#19c37d"],["Freelance","💻","#19c37d"],["Gift","🎁","#19c37d"],["Other","💰","#19c37d"]];
const CUR="৳",$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>CUR+Number(n).toLocaleString("en",{maximumFractionDigits:2});
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>{const[a,b,c]=s.split("-");return new Date(a,b-1,c)};
const def=()=>({accs:[{id:"cash",name:"Cash",emoji:"💵",open:0},{id:"bkash",name:"bKash",emoji:"📱",open:0},{id:"bank",name:"Bank",emoji:"🏦",open:0}],tx:[],t:0});
let S=def(),V={acc:"all",per:"month",off:0},ref=null;
try{const x=localStorage.getItem("sw");if(x)S=JSON.parse(x)}catch(e){}
try{const a=localStorage.getItem("swacc");if(a&&S.accs.some(z=>z.id===a))V.acc=a}catch(e){}
applyCats();
function save(){S.t=Date.now();try{localStorage.setItem("sw",JSON.stringify(S))}catch(e){}
 if(ref)ref.set({json:JSON.stringify(S),t:S.t}).catch(()=>{});render()}
function range(){const n=new Date();n.setHours(0,0,0,0);let a,b,l;
 if(V.per==="day"){a=new Date(n);a.setDate(a.getDate()+V.off);b=a;l=V.off===0?"Today":a.toLocaleDateString("en",{day:"numeric",month:"short",year:"numeric"})}
 else if(V.per==="week"){a=new Date(n);a.setDate(a.getDate()-((a.getDay()+6)%7)+V.off*7);b=new Date(a);b.setDate(b.getDate()+6);l=a.toLocaleDateString("en",{day:"numeric",month:"short"})+" – "+b.toLocaleDateString("en",{day:"numeric",month:"short"})}
 else if(V.per==="month"){a=new Date(n.getFullYear(),n.getMonth()+V.off,1);b=new Date(a.getFullYear(),a.getMonth()+1,0);l=a.toLocaleDateString("en",{month:"long",year:"numeric"})}
 else return{a:"0000",b:"9999",l:"All time"};
 return{a:ds(a),b:ds(b),l}}
const bal=id=>{const a=S.accs.find(x=>x.id===id);let v=a.open||0;S.tx.forEach(t=>{if(t.type==="i"&&t.acc===id)v+=t.amt;if(t.type==="e"&&t.acc===id)v-=t.amt;if(t.type==="t"){if(t.acc===id)v-=t.amt;if(t.to===id)v+=t.amt}});return v};
const an=id=>(S.accs.find(x=>x.id===id)||{name:"?"}).name;
const sgn=t=>t.type==='t'?(V.acc==='all'?0:t.to===V.acc?1:-1):t.type==='i'?1:-1;
const periodTx=()=>{const r=range();return S.tx.filter(t=>t.date>=r.a&&t.date<=r.b&&(V.acc==="all"||t.acc===V.acc||(t.type==="t"&&t.to===V.acc)))};
function render(){
 const r=range();$("lbl").textContent=r.l;$("pv").style.visibility=$("nx").style.visibility=V.per==="all"?"hidden":"visible";
 $("ac").textContent=(V.acc==="all"?"All accounts":an(V.acc))+" ⌄";
 $("seg").innerHTML=["day","week","month","all"].map(p=>`<button class="${V.per===p?"on":""}" data-p="${p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("");
 const P=periodTx(),own=t=>V.acc==="all"||t.acc===V.acc;
 const tE=P.filter(t=>t.type==="e"&&own(t)).reduce((s,t)=>s+t.amt,0),tI=P.filter(t=>t.type==="i"&&own(t)).reduce((s,t)=>s+t.amt,0);
 const by={};P.filter(t=>t.type==="e"&&own(t)).forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 const xI=V.acc==="all"?0:P.filter(t=>t.type==="t"&&t.to===V.acc).reduce((s,t)=>s+t.amt,0),xE=V.acc==="all"?0:P.filter(t=>t.type==="t"&&t.acc===V.acc).reduce((s,t)=>s+t.amt,0);
 if(V.sel&&!by[V.sel])V.sel=null;BY=by;TE=tE;
 const sc=V.sel&&CE.find(c=>c[0]===V.sel);
 $("mid").style.boxShadow=sc?`inset 0 0 0 3px ${sc[2]},0 0 24px ${sc[2]}66`:"";
 $("mid").innerHTML=sc?`<small style="color:${sc[2]}">${esc(sc[3]||sc[0]).toUpperCase()}</small><b style="color:${sc[2]};font-size:clamp(18px,6vw,26px);margin:3px 0">${money(by[V.sel])}</b><span class="tl">${Math.round(by[V.sel]/tE*100)}% of expenses<br>Tap to go back</span>`:`<small>INCOME</small><b class="inc">+${money(tI+xI)}</b><small>EXPENSE</small><b class="exp" style="margin:0">−${money(tE+xE)}</b><span class="tl">Tap for log ⌃</span>`;
 const C=2*Math.PI*78;let off=0,svg=`<circle cx="100" cy="100" r="78" fill="none" stroke="#1a2845" stroke-width="22"/>`;
 CE.forEach(c=>{const v=by[c[0]]||0;if(!v)return;const len=v/tE*C;svg+=`<circle cx="100" cy="100" r="78" fill="none" stroke="${c[2]}" data-k="${c[0]}" stroke-width="${V.sel===c[0]?27:22}" opacity="${V.sel&&V.sel!==c[0]?.25:1}" stroke-dasharray="${Math.max(len-2,.5)} ${C}" stroke-dashoffset="${-off}"/>`;off+=len});
 $("dn").innerHTML=svg;
 $("ics").innerHTML=CE.map((c,i)=>{const a=(-90+i*360/CE.length)*Math.PI/180,v=by[c[0]]||0;
  return`<button class="ci ${v?"":"z"} ${V.sel===c[0]?"sel":""} ${Math.sin(a)<-.1?"up":""}" style="left:${50+40*Math.cos(a)}%;top:${50+40*Math.sin(a)}%;--c:${c[2]};width:${CE.length>12?11.5:13.5}%" data-c="${c[0]}"><i>${c[1]}</i><em>${v?Math.round(v/tE*100)+"%":(c[3]||c[0])}</em></button>`}).join("");
 $("bv").textContent=$("rbv").textContent=money(V.acc==="all"?S.accs.reduce((s,a)=>s+bal(a.id),0):bal(V.acc));
 if($("rec").classList.contains("on"))renderLog();
}
const sh=$("sh"),open=h=>{$("sheet").innerHTML=h;sh.classList.add("on")},close=()=>sh.classList.remove("on");
sh.onclick=e=>{if(e.target===sh)close()};
const opts=sel=>S.accs.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.emoji||"")} ${esc(a.name)}</option>`).join("");
function form(type,t,pre){
 const edit=!!t,cats=type==="e"?CE:CI,col=type==="e"?"var(--r)":type==="i"?"var(--g)":"#6c8cff";
 const sel=t?.cat||pre||cats[0][0],a0=t?.acc||(V.acc!=="all"?V.acc:S.accs[0].id),a1=t?.to||(S.accs.find(a=>a.id!==a0)||{}).id;

async function saveOut(data,fn,type){

 const file=new File([data],fn,{type});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});return true}}catch(e){if(e&&e.name==="AbortError")return true}
 const sa=navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
 if(!sa){try{const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},5000);return true}catch(e){}}
 return false}

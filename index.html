<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101a2e">
<title>Monify</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#101a2e;--pn:#182540;--pn2:#1f2e4c;--line:#2a3a5a;--tx:#f1f5fb;--mut:#8d9ab3;--g:#19c37d;--r:#ff4565}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(600px 400px at 50% 30%,#18284a,transparent 70%),var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:10px 16px 12px}
header{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:#12392f;border:1px solid #1d6b52;color:var(--g);font-weight:800;font-size:20px;display:grid;place-items:center;flex:none}
.ti{flex:1;min-width:0}.ti b{display:block;font-size:16px;line-height:1.1}
.ti button{border:0;background:none;padding:0;color:var(--g);font-size:12px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--pn);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.seg button{border:0;background:none;color:var(--mut);padding:6px 9px;border-radius:9px;font-weight:600;font-size:13px}
.seg button.on{background:var(--pn2);color:var(--tx)}
.sq{width:40px;height:40px;border-radius:12px;background:var(--pn);border:1px solid var(--line);font-size:18px;flex:none}
.per{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;color:var(--mut);font-size:13px;letter-spacing:.8px;text-transform:uppercase;font-weight:600}
.per button{border:0;background:none;color:var(--mut);font-size:22px;width:34px;height:28px;line-height:1}
.per span{min-width:150px;text-align:center}
.stage{position:relative;width:min(94vw,400px,52vh);aspect-ratio:1;margin:auto}
#dn{position:absolute;left:18%;top:18%;width:64%;height:64%;transform:rotate(-90deg)}
.mid{position:absolute;inset:30%;border-radius:50%;background:#14213a;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:0;color:var(--tx)}
.mid small{font-size:10px;letter-spacing:1.2px;color:var(--mut);font-weight:700}
.mid b{font-size:clamp(15px,5vw,20px);font-weight:800;margin-bottom:6px}
.mid .tl{font-size:10px;color:var(--mut);letter-spacing:0;font-weight:500;margin:2px 0 0}
.ci{position:absolute;transform:translate(-50%,-50%);width:11.5%;aspect-ratio:1;border-radius:26%;background:var(--pn);border:2px solid var(--c);display:grid;place-items:center;font-size:clamp(16px,5.2vw,22px);padding:0;box-shadow:0 0 14px color-mix(in srgb,var(--c) 30%,transparent)}
.ci em{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-style:normal;font-size:11px;font-weight:700;white-space:nowrap}
.ci.up em{top:auto;bottom:100%;margin:0 0 3px}
.ci.z{border-color:var(--line);box-shadow:none;opacity:.75}.ci.z em{color:var(--mut);font-weight:500}
.ci.z i{filter:grayscale(1);opacity:.8}.ci i{font-style:normal}
.bal{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#14a06a,#17b9a0);border-radius:18px;padding:15px 20px;font-weight:800;box-shadow:0 8px 26px rgba(25,195,125,.3)}
.bal span{font-size:14px;letter-spacing:.3px;opacity:.95}.bal b{font-size:20px}
.foot{display:grid;grid-template-columns:78px 1fr 78px;align-items:center;margin-top:14px;text-align:center}
.fb{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:11px;font-weight:800;letter-spacing:.5px}
.fb i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:38px;font-weight:300;line-height:1;color:#fff}
.fb.e i{background:radial-gradient(circle at 35% 30%,#ff6b86,#ee2f55);box-shadow:0 8px 24px rgba(255,69,101,.5)}.fb.e{color:var(--r)}
.fb.i i{background:radial-gradient(circle at 35% 30%,#2fd89a,#12a86b);box-shadow:0 8px 24px rgba(25,195,125,.5)}.fb.i{color:var(--g)}
.hint{color:var(--mut);font-size:12px;padding:0 6px}
.tr{margin-top:8px;border:1px solid var(--line);background:var(--pn);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.shade{position:fixed;inset:0;background:rgba(5,10,20,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
.shade.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px}
.amt{width:100%;border:0;background:none;font-size:44px;font-weight:800;text-align:center;color:var(--tx);outline:0;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.cat{border:2px solid var(--line);background:var(--pn);border-radius:14px;padding:8px 2px;text-align:center;font-size:11px;color:var(--mut)}
.cat span{display:block;font-size:22px}.cat.on{border-color:var(--c);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--pn);color:var(--tx);font-size:16px}
.go{width:100%;border:0;color:#fff;padding:15px;border-radius:14px;font-size:16px;font-weight:800;margin-top:14px}
.ghost{background:var(--pn);color:var(--tx);border:1px solid var(--line);padding:11px;border-radius:12px;width:100%;font-size:15px;margin-top:8px}
.note{font-size:13px;color:var(--mut);margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--pn)}
.row .m{flex:1;min-width:0}.row .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m small{color:var(--mut)}
.dh{font-size:12px;color:var(--mut);font-weight:700;margin:14px 0 2px;text-transform:uppercase;letter-spacing:.6px}
.inc{color:var(--g)}.exp{color:var(--r)}.empty{text-align:center;color:var(--mut);padding:26px 0}
.pk{display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);background:var(--pn);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-weight:600}
.pk.on{border-color:var(--g);background:#12392f}
</style></head><body>
<div class="app">
 <header><button class="logo" id="lg" aria-label="Settings" style="cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><path d="M4 7.5V17a2 2 0 0 0 2 2h12.5a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 18.5 8H6.5A2.5 2.5 0 0 1 4 7.5z"/><circle cx="16" cy="13.5" r="1.2" fill="currentColor"/></svg></button>
  <div class="ti"><b>Monify</b><button id="ac"></button></div>
  <div class="seg" id="seg"></div><button class="sq" id="bl" aria-label="Records">☰</button></header>
 <div class="per"><button id="pv">‹</button><span id="lbl"></span><button id="nx">›</button></div>
 <div class="stage" id="st"><svg viewBox="0 0 200 200" id="dn"></svg><div id="ics"></div>
  <button class="mid" id="mid"></button></div>
 <div class="bal"><span>BALANCE</span><b id="bv"></b></div>
 <div class="foot"><button class="fb e" id="bE"><i>−</i>EXPENSE</button>
  <div><div class="hint">Tap any category icon<br>or use − / +</div><button class="tr" id="bT">⇄ Transfer</button></div>
  <button class="fb i" id="bI"><i>+</i>INCOME</button></div>
</div>
<div class="shade" id="sh"><div class="sheet" id="sheet"></div></div>
<script>
const CE=[["Food","🍔","#ff7a1a"],["Transport","🚗","#3b82f6"],["Shopping","🛍️","#ff6eb4"],["Bills","⚡","#f5b800"],["Home","🏠","#8b5cf6"],["Health","❤️","#ff4565"],["Leisure","🎬","#22d3ee"],["Family","🎁","#fb7185"],["Education","🎓","#10b981"],["Other","📦","#94a3b8"]];
const CI=[["Salary","💼","#19c37d"],["Business","🏪","#19c37d"],["Freelance","💻","#19c37d"],["Gift","🎁","#19c37d"],["Other","💰","#19c37d"]];
const CUR="৳",$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>CUR+Number(n).toLocaleString("en",{maximumFractionDigits:2});
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>{const[a,b,c]=s.split("-");return new Date(a,b-1,c)};
const def=()=>({accs:[{id:"cash",name:"Cash",emoji:"💵",open:0},{id:"bkash",name:"bKash",emoji:"📱",open:0},{id:"bank",name:"Bank",emoji:"🏦",open:0}],tx:[],t:0});
let S=def(),V={acc:"all",per:"month",off:0},ref=null;
try{const x=localStorage.getItem("sw");if(x)S=JSON.parse(x)}catch(e){}
function save(){S.t=Date.now();try{localStorage.setItem("sw",JSON.stringify(S))}catch(e){}
 if(ref)ref.set({json:JSON.stringify(S),t:S.t}).catch(()=>{});render()}
function range(){const n=new Date();n.setHours(0,0,0,0);let a,b,l;
 if(V.per==="day"){a=new Date(n);a.setDate(a.getDate()+V.off);b=a;l=V.off===0?"Today":a.toLocaleDateString("en",{day:"numeric",month:"short",year:"numeric"})}
 else if(V.per==="week"){a=new Date(n);a.setDate(a.getDate()-((a.getDay()+6)%7)+V.off*7);b=new Date(a);b.setDate(b.getDate()+6);l=a.toLocaleDateString("en",{day:"numeric",month:"short"})+" – "+b.toLocaleDateString("en",{day:"numeric",month:"short"})}
 else if(V.per==="month"){a=new Date(n.getFullYear(),n.getMonth()+V.off,1);b=new Date(a.getFullYear(),a.getMonth()+1,0);l=a.toLocaleDateString("en",{month:"long",year:"numeric"})}
 else return{a:"0000",b:"9999",l:"All time"};
 return{a:ds(a),b:ds(b),l}}
const bal=id=>{const a=S.accs.find(x=>x.id===id);let v=a.open||0;S.tx.forEach(t=>{if(t.type==="i"&&t.acc===id)v+=t.amt;if(t.type==="e"&&t.acc===id)v-=t.amt;if(t.type==="t"){if(t.acc===id)v-=t.amt;if(t.to===id)v+=t.amt}});return v};
const an=id=>(S.accs.find(x=>x.id===id)||{name:"?"}).name;
const periodTx=()=>{const r=range();return S.tx.filter(t=>t.date>=r.a&&t.date<=r.b&&(V.acc==="all"||t.acc===V.acc||(t.type==="t"&&t.to===V.acc)))};
function render(){
 const r=range();$("lbl").textContent=r.l;$("pv").style.visibility=$("nx").style.visibility=V.per==="all"?"hidden":"visible";
 $("ac").textContent=(V.acc==="all"?"All accounts":an(V.acc))+" ⌄";
 $("seg").innerHTML=["day","week","month","all"].map(p=>`<button class="${V.per===p?"on":""}" data-p="${p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("");
 const P=periodTx(),own=t=>V.acc==="all"||t.acc===V.acc;
 const tE=P.filter(t=>t.type==="e"&&own(t)).reduce((s,t)=>s+t.amt,0),tI=P.filter(t=>t.type==="i"&&own(t)).reduce((s,t)=>s+t.amt,0);
 const by={};P.filter(t=>t.type==="e"&&own(t)).forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 $("mid").innerHTML=`<small>INCOME</small><b class="inc">+${money(tI)}</b><small>EXPENSE</small><b class="exp" style="margin:0">−${money(tE)}</b><span class="tl">Tap for log ⌃</span>`;
 const C=2*Math.PI*78;let off=0,svg=`<circle cx="100" cy="100" r="78" fill="none" stroke="#1a2845" stroke-width="22"/>`;
 CE.forEach(c=>{const v=by[c[0]]||0;if(!v)return;const len=v/tE*C;svg+=`<circle cx="100" cy="100" r="78" fill="none" stroke="${c[2]}" stroke-width="22" stroke-dasharray="${Math.max(len-2,.5)} ${C}" stroke-dashoffset="${-off}"/>`;off+=len});
 $("dn").innerHTML=svg;
 $("ics").innerHTML=CE.map((c,i)=>{const a=(-90+i*36)*Math.PI/180,v=by[c[0]]||0;
  return`<button class="ci ${v?"":"z"} ${Math.sin(a)<-.1?"up":""}" style="left:${50+40*Math.cos(a)}%;top:${50+40*Math.sin(a)}%;--c:${c[2]}" data-c="${c[0]}"><i>${c[1]}</i><em>${v?Math.round(v/tE*100)+"%":c[0]}</em></button>`}).join("");
 $("bv").textContent=money(V.acc==="all"?S.accs.reduce((s,a)=>s+bal(a.id),0):bal(V.acc));
}
const sh=$("sh"),open=h=>{$("sheet").innerHTML=h;sh.classList.add("on")},close=()=>sh.classList.remove("on");
sh.onclick=e=>{if(e.target===sh)close()};
const opts=sel=>S.accs.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.emoji||"")} ${esc(a.name)}</option>`).join("");
function form(type,t,pre){
 const edit=!!t,cats=type==="e"?CE:CI,col=type==="e"?"var(--r)":type==="i"?"var(--g)":"#6c8cff";
 const sel=t?.cat||pre||cats[0][0],a0=t?.acc||(V.acc!=="all"?V.acc:S.accs[0].id),a1=t?.to||(S.accs.find(a=>a.id!==a0)||{}).id;
 open(`<h2>${edit?"Edit ":"New "}${{e:"expense",i:"income",t:"transfer"}[type]}</h2>
 <input class="amt" id="fa" inputmode="decimal" placeholder="${CUR}0" value="${t?t.amt:""}" style="color:${col}">
 ${type!=="t"?`<div class="grid">${cats.map(c=>`<button class="cat ${c[0]===sel?"on":""}" style="--c:${c[2]}" data-k="${c[0]}"><span>${c[1]}</span>${c[0]}</button>`).join("")}</div><label>Account</label><select id="fc">${opts(a0)}</select>`
 :`<div class="two"><div><label>From</label><select id="fc">${opts(a0)}</select></div><div><label>To</label><select id="fd">${opts(a1)}</select></div></div>`}
 <label>Date</label><input type="date" id="fdt" value="${t?.date||ds(new Date())}">
 ${type!=="t"?`<label>Note (optional)</label><input id="fn" value="${esc(t?.note||"")}" placeholder="e.g. Lunch with friends">`:""}
 <button class="go" style="background:${col}" id="fs">Save</button>${edit?`<button class="ghost" id="fx" style="color:var(--r)">Delete record</button>`:""}`);
 let cat=sel;
 document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{cat=b.dataset.k;document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("on",x===b))});
 if(!edit)setTimeout(()=>$("fa").focus(),150);
 $("fs").onclick=()=>{const amt=parseFloat($("fa").value);if(!(amt>0)){$("fa").focus();return}
  const o={id:t?.id||Date.now(),type,amt,acc:$("fc").value,date:$("fdt").value||ds(new Date())};
  if(type==="t"){o.to=$("fd").value;if(o.to===o.acc){alert("Choose two different accounts.");return}}else{o.cat=cat;o.note=$("fn").value.trim()}
  if(edit)S.tx=S.tx.map(x=>x.id===t.id?o:x);else S.tx.push(o);close();save()};
 if(edit)$("fx").onclick=()=>{if(confirm("Delete this record?")){S.tx=S.tx.filter(x=>x.id!==t.id);close();save()}};
}
function log(){
 const P=periodTx().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),days={};P.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
 open(`<h2>Records · ${esc(range().l)}</h2>`+(P.length?Object.keys(days).map(d=>`<div class="dh">${pd(d).toLocaleDateString("en",{weekday:"long",day:"numeric",month:"short"})}</div>`+days[d].map(t=>{
  const c=(t.type==="e"?CE:CI).find(x=>x[0]===t.cat);
  return`<div class="row" data-t="${t.id}"><div class="ic">${t.type==="t"?"⇄":c?c[1]:"📦"}</div><div class="m"><div>${esc(t.type==="t"?"Transfer":t.cat)}${t.note?" · "+esc(t.note):""}</div><small>${esc(t.type==="t"?an(t.acc)+" → "+an(t.to):an(t.acc))}</small></div><b class="${t.type==="e"?"exp":t.type==="i"?"inc":""}">${t.type==="e"?"−":t.type==="i"?"+":""}${money(t.amt)}</b></div>`}).join("")).join(""):`<div class="empty">No records for this period.</div>`));
}
function picker(){
 open(`<h2>Account</h2><button class="pk ${V.acc==="all"?"on":""}" data-a="all"><span>🧾 All accounts</span><b>${money(S.accs.reduce((s,a)=>s+bal(a.id),0))}</b></button>`+S.accs.map(a=>`<button class="pk ${V.acc===a.id?"on":""}" data-a="${a.id}"><span>${esc(a.emoji||"")} ${esc(a.name)}</span><b>${money(bal(a.id))}</b></button>`).join(""));
}
function settings(){
 open(`<h2>Settings</h2><div class="note" id="syn"></div>
 <label>Accounts &amp; opening balance</label>
 ${S.accs.map(a=>`<div class="two" style="grid-template-columns:1fr 110px;margin-bottom:6px"><input data-n="${a.id}" value="${esc(a.name)}"><input data-o="${a.id}" inputmode="decimal" value="${a.open||0}"></div>`).join("")}
 <div class="two" style="grid-template-columns:1fr 110px"><input id="na" placeholder="New account name"><button class="ghost" id="aa" style="margin:0">Add</button></div>
 <button class="go" style="background:var(--g)" id="ss">Save accounts</button>
 <button class="ghost" id="ex">Export backup (JSON)</button><button class="ghost" id="im">Import backup</button>
 <input type="file" id="fi" accept=".json" style="display:none"><button class="ghost" id="cl">Close</button>`);
 setSyn();
 $("ss").onclick=()=>{document.querySelectorAll("[data-n]").forEach(i=>{const a=S.accs.find(x=>x.id===i.dataset.n);a.name=i.value.trim()||a.name});
  document.querySelectorAll("[data-o]").forEach(i=>{S.accs.find(x=>x.id===i.dataset.o).open=parseFloat(i.value)||0});close();save()};
 $("aa").onclick=()=>{const n=$("na").value.trim();if(!n)return;S.accs.push({id:"a"+Date.now(),name:n,emoji:"👛",open:0});save();settings()};
 $("cl").onclick=close;
 $("ex").onclick=async()=>{const data=JSON.stringify(S,null,1),fn="monify-backup-"+ds(new Date())+".json";
  try{const d=await claude.use("downloads");if(d){await d.save({filename:fn,data});return}}catch(e){}
  const a=document.createElement("a");a.href="data:application/json,"+encodeURIComponent(data);a.download=fn;a.click()};
 $("im").onclick=()=>$("fi").click();
 $("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{const j=JSON.parse(x);if(j.accs&&j.tx){S=j;close();save()}else alert("Not a valid backup.")}).catch(()=>alert("Could not read file."))};
}
function setSyn(){const e=$("syn");if(e)e.innerHTML=ref?"✅ <b>Synced</b> to your signed-in account. Open this page on any device with the same account.":"📴 Saved on this device only. Open the page while signed in to claude.ai to enable cross-device sync."}
document.addEventListener("click",e=>{const g=s=>e.target.closest(s);let x;
 if(x=g("[data-p]")){V.per=x.dataset.p;V.off=0;render()}
 else if(x=g(".ci")){form("e",null,x.dataset.c)}
 else if(x=g("[data-a]")){V.acc=x.dataset.a;close();render()}
 else if(x=g("[data-t]")){const t=S.tx.find(y=>String(y.id)===x.dataset.t);if(t)form(t.type,t)}});
$("pv").onclick=()=>{V.off--;render()};$("nx").onclick=()=>{V.off++;render()};
$("bE").onclick=()=>form("e");$("bI").onclick=()=>form("i");$("bT").onclick=()=>form("t");
$("mid").onclick=log;$("bl").onclick=log;$("ac").onclick=picker;$("lg").onclick=settings;
render();
(async()=>{try{if(!window.claude)return;const u=await claude.use("user"),db=await claude.use("db");if(!u||!db)return;
 const id=await u.id();if(!id)return;const r=db.collection("data/users/"+id).doc("state");const s=await r.get();
 if(s.exists){const d=s.data();if(d.t>(S.t||0)){S=JSON.parse(d.json);try{localStorage.setItem("sw",d.json)}catch(e){}}else await r.set({json:JSON.stringify(S),t:S.t})}
 else if(S.tx.length)await r.set({json:JSON.stringify(S),t:S.t});
 ref=r;render();setSyn()}catch(e){}})();
</script></body></html>
